services:
  backend:
    build: .
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build: .
    container_name: celery_worker
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379
      - SANDBOX_TMP=/tmp/codebench-sandbox
    volumes:
      - .:/app
      # The worker starts sandbox containers through the host Docker daemon.
      # Code files live in a directory with the same path on the host and in the worker,
      # so the bind mount passed to `docker run` resolves correctly.
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/codebench-sandbox:/tmp/codebench-sandbox
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: redis

  sandbox_python:
    image: sandbox_python
    build:
      context: ./sandbox/Python
    container_name: sandbox_python

  sandbox_cpp:
    image: sandbox_cpp
    build:
      context: ./sandbox/Cpp
    container_name: sandbox_cpp

  sandbox_js:
    image: sandbox_js
    build:
      context: ./sandbox/JS
    container_name: sandbox_js
